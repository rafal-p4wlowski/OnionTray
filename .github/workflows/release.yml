name: Release

# - Push a tag like v2.0.0 (matching version.py): build OnionTray.exe and
#   publish it as a GitHub release.
# - "Run workflow" button (workflow_dispatch): test build only; the exe is
#   attached to the run as a downloadable artifact, nothing is published.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Check tag matches version.py
        if: startsWith(github.ref, 'refs/tags/')
        shell: python
        run: |
          import os, sys
          sys.path.insert(0, ".")
          from version import __version__
          tag = os.environ["GITHUB_REF_NAME"]
          if tag != f"v{__version__}":
              sys.exit(f"Tag {tag} does not match version.py ({__version__})")

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt pyinstaller

      - name: Run tests
        run: python -m pytest -q

      - name: Build
        run: pyinstaller --noconfirm OnionTray.spec

      - name: Upload exe as run artifact
        uses: actions/upload-artifact@v4
        with:
          name: OnionTray-exe
          path: dist/OnionTray.exe

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/OnionTray.exe
          generate_release_notes: true
